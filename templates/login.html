<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login Form</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(to right, #232526, #414345);
  padding:20px;
}

/* FORM CONTAINER */
.login-form{
  width:100%;
  max-width:420px;
  background:white;
  padding:40px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

/* TITLE */
.login-form h2{
  text-align:center;
  margin-bottom:10px;
  color:#111;
  font-size:32px;
}

.login-form p{
  text-align:center;
  color:#666;
  margin-bottom:30px;
}

/* MESSAGE */
.message{
  background:#f1f1f1;
  padding:12px;
  border-radius:10px;
  margin-bottom:20px;
  text-align:center;
  color:#111;
}

/* INPUT BOX */
.input-box{
  position:relative;
  margin-bottom:20px;
}

.input-box i.left-icon{
  position:absolute;
  top:50%;
  left:15px;
  transform:translateY(-50%);
  color:#888;
}

/* INPUTS */
.input-box input{
  width:100%;
  padding:15px 45px 15px 50px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:15px;
  outline:none;
  transition:0.3s;
}

.input-box input:focus{
  border-color:#ff6600;
  box-shadow:0 0 5px rgba(255,102,0,0.3);
}

/* EYE ICON */
.eye-icon{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  color:#888;
  cursor:pointer;
}

/* OPTIONS */
.form-options{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  font-size:14px;
}

.form-options a{
  color:#ff6600;
  text-decoration:none;
}

/* BUTTON */
.login-btn{
  width:100%;
  padding:15px;
  border:none;
  background:#ff6600;
  color:white;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.login-btn:hover{
  background:#e65c00;
  transform:translateY(-2px);
}

/* REGISTER LINK */
.register-link{
  text-align:center;
  margin-top:20px;
  color:#666;
}

.register-link a{
  color:#ff6600;
  text-decoration:none;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="login-form">

  <h2>{{ t.get('login_hello', 'login_hello') }}</h2>
  <p>{{ t.get('login_title', 'login_title') }}</p>

  {% if message %}<div class="message">{{ message|safe }}</div>{% endif %}

  <form method="POST">

    <div class="input-box">

      <i class="fas fa-envelope left-icon"></i>

      <input type="email"
      name="email"
      placeholder="Email Address"
      required>

    </div>

    <div class="input-box">

      <i class="fas fa-lock left-icon"></i>

      <input type="password"
      name="password"
      placeholder="Password"
      id="loginPassword"
      required>

      <i class="fas fa-eye eye-icon"
      onclick="togglePassword()"></i>

    </div>

    <div class="form-options">

      <label>
        <input type="checkbox">
        {{ t.get('login_remember_me', 'login_remember_me') }}
      </label>

      <a href="{{ url_for('forgot_password') }}">
        {{ t.get('login_forgot_password', 'login_forgot_password') }}
      </a>

    </div>

    <button type="submit"
    name="login"
    class="login-btn">

      {{ t.get('login_button', 'login_button') }}

    </button>

  </form>

  <div class="register-link">

      {{ t.get('login_no_account', 'login_no_account') }}
     

    <a href="{{ url_for('register') }}">
      {{ t.get('login_signup', 'login_signup') }}
    </a>

  </div>

</div>

<script>

function togglePassword(){

  const input =
  document.getElementById("loginPassword");

  const icon =
  document.querySelector(".eye-icon");

  if(input.type === "password"){

    input.type = "text";

    icon.classList.remove("fa-eye");

    icon.classList.add("fa-eye-slash");

  }else{

    input.type = "password";

    icon.classList.remove("fa-eye-slash");

    icon.classList.add("fa-eye");

  }

}

</script>

</body>
</html>
