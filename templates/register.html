<!DOCTYPE html>
<html lang="{{ lang }}">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

{{ t.get('create_account', 'create_account') }}

</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(to right, #232526, #414345);
    padding:20px;
}

.register-form{
    width:100%;
    max-width:450px;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.register-form h2{
    text-align:center;
    margin-bottom:10px;
    color:#111;
    font-size:32px;
}

.register-form p{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

.message{
    background:#f1f1f1;
    padding:12px;
    border-radius:10px;
    margin-bottom:20px;
    text-align:center;
    color:red;
}

.input-box{
    position:relative;
    margin-bottom:20px;
}

.input-box .left-icon{
    position:absolute;
    top:50%;
    left:15px;
    transform:translateY(-50%);
    color:#888;
}

.eye-icon{
    position:absolute;
    top:50%;
    right:15px;
    transform:translateY(-50%);
    color:#888;
    cursor:pointer;
}

.input-box input,
.input-box select{
    width:100%;
    padding:15px 45px 15px 50px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:15px;
    outline:none;
}

.input-box input:focus,
.input-box select:focus{
    border-color:#ff6600;
}

.register-btn{
    width:100%;
    padding:15px;
    border:none;
    background:#ff6600;
    color:white;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.register-btn:hover{
    background:#e65c00;
}

.login-link{
    text-align:center;
    margin-top:20px;
    color:#666;
}

.login-link a{
    color:#ff6600;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="register-form">

<h2>

{{ t.get('create_account', 'create_account') }}

</h2>

<p>

{{ t.get('join_today', 'join_today') }}

</p>

{% if message %}<div class="message">{{ message|safe }}</div>{% endif %}

<form method="POST">

<div class="input-box">

<i class="fas fa-user left-icon"></i>

<input type="text"
name="full_name"
placeholder="{{ t.get('full_name', 'full_name') }}"
required>

</div>

<div class="input-box">

<i class="fas fa-envelope left-icon"></i>

<input type="email"
name="email"
placeholder="{{ t.get('email_address', 'email_address') }}"
required>

</div>

<div class="input-box">

<i class="fas fa-phone left-icon"></i>

<input type="text"
name="phone"
placeholder="{{ t.get('phone_number', 'phone_number') }}"
required>

</div>

<div class="input-box">

<i class="fas fa-user-tag left-icon"></i>

<select name="account_type" required>

<option value="">

{{ t.get('select_account_type', 'select_account_type') }}

</option>

<option value="Client">

{{ t.get('client', 'client') }}

</option>

<option value="Driver">

{{ t.get('driver', 'driver') }}

</option>

</select>

</div>

<div class="input-box">

<i class="fas fa-lock left-icon"></i>

<input type="password"
name="password"
placeholder="{{ t.get('password', 'password') }}"
id="password"
required>

<i class="fas fa-eye eye-icon"
onclick="togglePassword('password', this)">
</i>

</div>

<div class="input-box">

<i class="fas fa-lock left-icon"></i>

<input type="password"
name="confirm_password"
placeholder="{{ t.get('confirm_password', 'confirm_password') }}"
id="confirmPassword"
required>

<i class="fas fa-eye eye-icon"
onclick="togglePassword('confirmPassword', this)">
</i>

</div>

<button type="submit"
name="register"
class="register-btn">

{{ t.get('create_account_btn', 'create_account_btn') }}

</button>

</form>

<div class="login-link">

{{ t.get('already_have_account', 'already_have_account') }}

<a href="{{ url_for('login') }}">

{{ t.get('login', 'login') }}

</a>

</div>

</div>

<script>

function togglePassword(id, icon){

    let input = document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";

        icon.classList.remove("fa-eye");

        icon.classList.add("fa-eye-slash");

    }else{

        input.type = "password";

        icon.classList.remove("fa-eye-slash");

        icon.classList.add("fa-eye");

    }

}

</script>

</body>
</html>
