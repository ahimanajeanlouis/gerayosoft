<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reset Password - GerayoSoft</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(to right,#232526,#414345);font-family:Arial,sans-serif;padding:20px}.box{width:100%;max-width:430px;background:#fff;padding:40px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.2)}h2{text-align:center;margin:0 0 25px}.field{margin-bottom:16px}.field input{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px}.btn{width:100%;padding:14px;border:0;border-radius:10px;background:#ff6600;color:#fff;font-weight:bold;cursor:pointer}.message{padding:12px;border-radius:10px;background:#fff4d6;margin-bottom:18px;text-align:center}.back{text-align:center;margin-top:18px}.back a{color:#ff6600;text-decoration:none}</style></head><body><div class="box"><h2>Reset Password</h2>{% if message %}<div class="message">{{ message }}</div>{% endif %}{% if valid %}<form method="post"><input type="hidden" name="token" value="{{ token }}"><div class="field"><input type="password" name="password" placeholder="New password" required></div><div class="field"><input type="password" name="confirm" placeholder="Confirm password" required></div><button class="btn">Update Password</button></form>{% else %}<p style="text-align:center">This reset link is invalid or has expired.</p>{% endif %}<div class="back"><a href="{{ url_for('login') }}">Back to login</a></div></div></body></html>
